# Subconfigs
source = ~/.config/hypr/subconfs/env.conf
source = ~/.config/hypr/subconfs/looknfeel.conf
source = ~/.config/hypr/subconfs/window.conf
source = ~/.config/hypr/subconfs/misc.conf

source = ~/.config/hypr/bindings/apps.conf
source = ~/.config/hypr/bindings/tiling.conf
source = ~/.config/hypr/bindings/media.conf

# Monitor
monitor=,preferred,auto,auto

# Autostart
exec-once = hypridle
exec-once = hyprpaper
exec-once = swayosd-server
exec-once = waybar
exec-once = kime
